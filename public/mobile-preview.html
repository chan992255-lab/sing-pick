<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>싱픽 모바일 미리보기 (390×844)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 16px;
        background: #05040b;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        color: #a1a1aa;
      }
      .frame {
        width: 390px;
        height: 844px;
        border: 10px solid #1b1826;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 30px 80px -30px rgba(139, 92, 246, 0.65);
        background: #08060f;
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        display: block;
      }
      p {
        font-size: 12px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <iframe src="../" title="싱픽 모바일 미리보기"></iframe>
    </div>
    <p>iPhone 14 (390×844) 미리보기</p>
  </body>
</html>
